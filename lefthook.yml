# Guardrail hooks — the committer-facing gate (human or agent).
# Layering: these hooks are the fast local gate on commit/push; CI is the
# hard gate that mirrors the FULL suite (check-types + test + build + quality)
# so --no-verify cannot defeat it.
#
# Correctness rule: format/lint runs on STAGED files (fast, per-file safe),
# but check-types runs on the WHOLE project — the TS checker needs the full
# type graph, so staged-only would give misleading pass/fail.
#
# pre-push deliberately runs ONLY the fast, high-signal checks (check-types +
# quality — both turbo-cached, a few seconds). The full `test` and `build`
# runs used to live here too, but they're slow (Postgres-backed integration
# tests across every package) and exactly duplicate what CI runs on the PR, so
# they were dropped from push time. CI remains the backstop for the full suite.

pre-commit:
  parallel: true
  commands:
    biome:
      glob: "*.{ts,tsx,js,jsx,json,jsonc,css}"
      run: pnpm biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true

# Each command sources a local `.env` (gitignored — it holds the local
# DATABASE_URL) before running, so any DB-touching check connects automatically
# without the committer manually exporting it. `[ -f .env ]` keeps this a no-op
# when there is no .env (e.g. CI, where DATABASE_URL is injected by the
# environment instead). (Kept from main even though `test` no longer runs on
# push — `quality` shells out to nothing DB-backed today, but the prefix is
# harmless and future-proofs any check added here.)
pre-push:
  parallel: true
  commands:
    check-types:
      run: set -a; [ -f .env ] && . ./.env; set +a; pnpm turbo run check-types
    quality:
      run: set -a; [ -f .env ] && . ./.env; set +a; pnpm quality
