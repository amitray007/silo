# Guardrail hooks — the committer-facing gate (human or agent).
# Layering: Claude Code hooks give the agent fast per-edit feedback;
# these hooks are the hard gate on commit/push; CI (U5) mirrors them so
# --no-verify cannot defeat the gate.
#
# Correctness rule: format/lint runs on STAGED files (fast, per-file safe),
# but check-types and tests run on the WHOLE project — the TS checker needs
# the full type graph, so staged-only would give misleading pass/fail.

pre-commit:
  parallel: true
  commands:
    biome:
      glob: "*.{ts,tsx,js,jsx,json,jsonc,css}"
      run: pnpm biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true

# DB-backed suites (@silo/app, @silo/api, @silo/core, ...) read DATABASE_URL
# from the environment and THROW when it is unset. The push hook otherwise
# runs without it, so `test` failed with "DATABASE_URL must be set" unless the
# committer had manually exported it. Each command sources a local `.env`
# (gitignored — it holds the local DATABASE_URL) before running, so the gate
# connects automatically. `[ -f .env ]` keeps this a no-op when there is no
# .env (e.g. CI, where DATABASE_URL is injected by the environment instead).
pre-push:
  parallel: true
  commands:
    check-types:
      run: set -a; [ -f .env ] && . ./.env; set +a; pnpm turbo run check-types
    test:
      run: set -a; [ -f .env ] && . ./.env; set +a; pnpm turbo run test
    build:
      run: set -a; [ -f .env ] && . ./.env; set +a; pnpm turbo run build
    quality:
      run: set -a; [ -f .env ] && . ./.env; set +a; pnpm quality
