# silo — production compose (the deployable-silo slice,
# docs/superpowers/specs/2026-07-11-deployable-silo-design.md).
#
# THREE services from the ONE Dockerfile image: a pgvector Postgres, the `api`
# container (web UI + REST + in-process worker), and the `mcp` container (the
# HTTP MCP listener). Run it directly with:
#
#   docker compose -f docker-compose.prod.yml up --build
#
# ...or mirror these two services in Dokploy, each pointed at the same image
# with its own command + domain (silo.<domain> -> api, mcp.silo.<domain> -> mcp).
# See docs/deploy.md.
#
# Secrets/config come from the environment (a .env file next to this compose, or
# Dokploy's env UI) — NEVER baked into the image. Copy .env.example and fill in
# real values. The values below with `${VAR:?...}` are REQUIRED (compose errors
# if unset) so a misconfigured deploy fails loudly instead of running insecure.

services:
  postgres:
    # pgvector, NOT plain postgres: migration 0000 runs `CREATE EXTENSION vector`
    # (packages/db/drizzle/0000_enable-extensions.sql). Same image CI + local dev
    # use (pgvector/pgvector:pg18).
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-silo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-silo}
    volumes:
      - silo-pgdata:/var/lib/postgresql/data
    healthcheck:
      # The simplest reliable check: `pg_isready` with NO -U/-d — it only asks
      # "is the local server accepting connections?", which is exactly what the
      # `depends_on: service_healthy` gate needs, and it can't fail on a user/db
      # name mismatch (a prior `-U "$POSTGRES_USER"` form failed when that env
      # var wasn't populated in the healthcheck's shell). Defaults to the local
      # socket as the postgres superuser context, always valid once the server
      # is up.
      test: ['CMD-SHELL', 'pg_isready']
      interval: 5s
      timeout: 5s
      retries: 20
      # A slow first boot (volume init + pgvector extension) shouldn't burn the
      # 20 retries before the server is even accepting connections.
      start_period: 30s
    networks:
      - silo

  api:
    # Serves the web UI at /, the REST API at /api, and runs the enrichment
    # worker in-process. Owns migrations: it runs `db:migrate` (idempotent —
    # drizzle tracks applied migrations) BEFORE starting the server, so a fresh
    # volume or a pulled-migration branch is applied on boot.
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      # Bind off-loopback so the reverse proxy / other containers can reach it
      # (the API is auth-gated in prod via SILO_APP_PASSWORD / SILO_API_TOKEN).
      HOST: '0.0.0.0'
      PORT: '8787'
      SILO_APP_PASSWORD: ${SILO_APP_PASSWORD:-}
      SILO_SESSION_SECRET: ${SILO_SESSION_SECRET:-}
      SILO_API_TOKEN: ${SILO_API_TOKEN:-}
      SILO_ALLOWED_ORIGINS: ${SILO_ALLOWED_ORIGINS:-}
      # The public MCP endpoint the "Copy config" button hands out. Set this to
      # your mcp subdomain; if unset, the web derives https://mcp.<host>/mcp.
      SILO_PUBLIC_MCP_URL: ${SILO_PUBLIC_MCP_URL:-}
      SILO_TRASH_PURGE_DAYS: ${SILO_TRASH_PURGE_DAYS:-}
      SILO_ENRICHING_STALE_MINUTES: ${SILO_ENRICHING_STALE_MINUTES:-}
    # Migrate (idempotent) then serve via the @silo/app composition-root
    # entrypoint (web + API + in-process worker — api-main.ts). `sh -c` so both
    # run in one container. Use `pnpm --filter … run start:api` (a package
    # script), NOT `pnpm exec tsx …` from root — tsx's bin is linked inside
    # packages/app, not the repo-root .bin (see the Dockerfile CMD comment).
    command: >
      sh -c "pnpm --filter @silo/db run db:migrate &&
             pnpm --filter @silo/app run start:api"
    ports:
      # Expose for a direct `docker compose up` run. Behind Dokploy/Traefik you
      # route silo.<domain> -> this service and can drop the host publish.
      - '${API_PORT:-8787}:8787'
    networks:
      - silo

  mcp:
    # The HTTP MCP listener ONLY (packages/app/src/mcp-http-main.ts) — NOT the
    # turnkey `@silo/app start`, which would ALSO run the enrichment worker and
    # double up the api container's in-process worker (duplicate cron jobs +
    # contended enrichment). This lean entrypoint runs just the listener.
    # ALWAYS-CLOSED: refuses to start without SILO_API_TOKEN. Does NOT run
    # migrations (the api service owns those) — depends on api having started so
    # the schema exists.
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      # Turns the HTTP MCP listener on. The listener binds this port; Traefik
      # routes mcp.silo.<domain> -> this service.
      SILO_MCP_HTTP_PORT: '8788'
      # Bind off-loopback so the proxy/other containers can reach it.
      SILO_MCP_HTTP_HOST: '0.0.0.0'
      # The PUBLIC host(s) the listener is proxied under — added verbatim (no
      # port) to the SDK's DNS-rebinding allowlist, or a proxied request whose
      # Host header is `mcp.silo.<domain>` (no :8788) gets 403. Set this to your
      # mcp subdomain(s), comma-separated.
      SILO_MCP_ALLOWED_HOSTS: ${SILO_MCP_ALLOWED_HOSTS:-}
      # REQUIRED for the listener to start at all (the machine bearer agents send).
      SILO_API_TOKEN: ${SILO_API_TOKEN:?set SILO_API_TOKEN (the mcp listener refuses to start without it)}
    # A package script (tsx resolves in packages/app's context), not
    # `pnpm exec tsx …` from root — see the api command / Dockerfile comment.
    command: ['pnpm', '--filter', '@silo/app', 'run', 'start:mcp-http']
    ports:
      - '${MCP_PORT:-8788}:8788'
    networks:
      - silo

volumes:
  silo-pgdata:

networks:
  silo:
