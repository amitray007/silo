<!doctype html>
<!--
  PROTOTYPE — throwaway. Layout A (three-pane reader) with the orange tile mark,
  made fully clickable for quick testing. Every control mutates in-memory state;
  nothing persists and no data leaves the page (the Original tab is the one
  exception: it loads the live page when you ask for it).

  Width modes follow the frame, not the window:
    wide   ≥ 1100px  sidebar | list | reader (sidebar can collapse)
    mid    720–1099  list | reader, sidebar opens as a drawer
    narrow < 720px   list, then reader as its own screen; sidebar drawer
  The bottom bar can pin the frame to a tablet or phone size.
-->
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f6f6f5" />
<title>silo — redesign prototype</title>
<style>
/*__FONTS__*/
</style>
<style>
/* ───────────── Tokens ───────────── */
:root {
  --bg: #f6f6f5; --panel: #ffffff; --line: #e6e6e4; --line-2: #d6d6d3;
  --hov: #f1f1ef; --sel: #ebebe9;
  --ink: #0c0c0b; --mut: #5c5c59; --fnt: #8a8a86;
  --btn: #111110; --btn-ink: #ffffff;
  --accent-a: #ffb23f; --accent-b: #ff6a13; --accent: #f26b1d;
  --accent-soft: #fff1e6; --accent-ink: #b8480a; --danger: #d63a2f;
  --scrim: rgba(12, 12, 11, 0.32); --stage: #e4e4e1;
  --elev-1: 0 1px 2px rgba(0,0,0,.06);
  --elev-2: 0 1px 2px rgba(0,0,0,.05), 0 8px 24px -6px rgba(0,0,0,.14);
  --elev-3: 0 2px 6px rgba(0,0,0,.06), 0 24px 64px -12px rgba(0,0,0,.28);
  --r-sm: 6px; --r: 8px; --r-lg: 12px; --r-xl: 16px;
  --ease: cubic-bezier(0.23, 1, 0.32, 1);
  --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);
  --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
}
[data-theme="dark"] {
  --bg: #0a0a0a; --panel: #111111; --line: #222222; --line-2: #2e2e2e;
  --hov: #181818; --sel: #1f1f1f;
  --ink: #f3f3f2; --mut: #a3a3a0; --fnt: #757572;
  --btn: #f3f3f2; --btn-ink: #0a0a0a;
  --accent-soft: #2a1709; --accent-ink: #ff9a52;
  --scrim: rgba(0,0,0,.6); --stage: #050505;
  --elev-1: 0 1px 2px rgba(0,0,0,.5);
  --elev-2: 0 1px 2px rgba(0,0,0,.5), 0 8px 24px -6px rgba(0,0,0,.6);
  --elev-3: 0 2px 6px rgba(0,0,0,.5), 0 24px 64px -12px rgba(0,0,0,.8);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: "Geist", ui-sans-serif, system-ui, sans-serif;
  font-size: 14px; line-height: 1.45; color: var(--ink); background: var(--stage);
  -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums;
  overscroll-behavior: none;
}
button, a.btn { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; user-select: none; }
input, textarea { font: inherit; color: inherit; }
svg { display: block; }
.ic { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: none; }
:focus-visible { outline: 2px solid var(--fnt); outline-offset: 1px; }

/* ───────────── Stage + device frame ───────────── */
.stage { height: 100dvh; display: grid; place-items: center; }
.frame { position: relative; width: 100vw; height: 100dvh; overflow: hidden; background: var(--bg); transform: translateZ(0); container-type: inline-size; }
.stage[data-device="tablet"] .frame { width: 834px; height: min(1112px, calc(100dvh - 88px)); border-radius: 22px; box-shadow: 0 0 0 1px var(--line-2), var(--elev-3); }
.stage[data-device="phone"] .frame { width: 390px; height: min(844px, calc(100dvh - 88px)); border-radius: 40px; box-shadow: 0 0 0 10px #1b1b1b, 0 0 0 11px #333, var(--elev-3); }
.stage[data-device="phone"] .frame { --sat: 44px; --sab: 26px; }
.stage[data-device="phone"] .frame::after { content: ""; position: absolute; top: 11px; left: 50%; width: 112px; height: 32px; margin-left: -56px; background: #000; border-radius: 20px; z-index: 200; pointer-events: none; }
.stage[data-device="phone"] .frame::before { content: ""; position: absolute; bottom: 8px; left: 50%; width: 134px; height: 5px; margin-left: -67px; background: var(--ink); opacity: .35; border-radius: 3px; z-index: 200; pointer-events: none; }
.stage:not([data-device="fit"]) { padding-bottom: 56px; }

/* ───────────── Brand ───────────── */
.brand { display: flex; align-items: center; gap: 9px; font-weight: 600; font-size: 16px; letter-spacing: -0.02em; }
.mark { width: 26px; height: 26px; flex: none; border-radius: 7px; position: relative; background: linear-gradient(160deg, var(--accent-a), var(--accent-b)); box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 1px 2px rgba(180,70,0,.35); }
.mark i { position: absolute; left: 6px; right: 6px; height: 4px; border-radius: 3px; background: #fff; }
.mark i:nth-child(1) { top: 6.5px; } .mark i:nth-child(2) { top: 11px; opacity: .72; } .mark i:nth-child(3) { top: 15.5px; opacity: .46; }
.mark.xl { width: 44px; height: 44px; border-radius: 12px; }
.mark.xl i { left: 10px; right: 10px; height: 6px; } .mark.xl i:nth-child(1) { top: 11px; } .mark.xl i:nth-child(2) { top: 19px; } .mark.xl i:nth-child(3) { top: 27px; }

/* ───────────── Atoms ───────────── */
.kbd { font-size: 11px; color: var(--fnt); border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; line-height: 17px; background: var(--panel); font-weight: 500; }
.count { margin-left: auto; font-size: 12px; color: var(--fnt); font-weight: 400; }
.btn { height: 30px; padding: 0 12px; border-radius: var(--r); font-weight: 500; font-size: 13px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; transition: background .15s, opacity .15s, transform .1s var(--ease); text-decoration: none; }
.btn:active { transform: scale(.97); }
.btn.sm { height: 26px; padding: 0 9px; font-size: 12.5px; }
.btn-primary { background: var(--btn); color: var(--btn-ink); box-shadow: var(--elev-1); }
.btn-ghost { border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
.btn-danger { color: var(--danger); border: 1px solid var(--line); background: var(--panel); }
.btn-danger.solid { background: var(--danger); color: #fff; border-color: var(--danger); }
.iconbtn { width: 28px; height: 28px; border-radius: var(--r-sm); display: grid; place-items: center; color: var(--mut); flex: none; transition: background .15s, color .15s, transform .1s var(--ease); }
.iconbtn:active { transform: scale(.92); }
.iconbtn:disabled { opacity: .35; cursor: default; }
@media (hover: hover) and (pointer: fine) {
  .btn-primary:hover { opacity: .88; }
  .btn-ghost:hover, .btn-danger:hover { background: var(--hov); }
  .iconbtn:not(:disabled):hover { background: var(--hov); color: var(--ink); }
}
.seg { display: inline-flex; background: var(--hov); border-radius: var(--r); padding: 2px; gap: 2px; }
.seg button { height: 26px; padding: 0 12px; border-radius: 6px; font-size: 13px; font-weight: 500; color: var(--mut); transition: color .12s; }
.seg button.on { background: var(--panel); color: var(--ink); box-shadow: var(--elev-1); }
[data-theme="dark"] .seg button.on { background: var(--line-2); }
.fav { width: 18px; height: 18px; border-radius: 5px; flex: none; display: grid; place-items: center; font-size: 10.5px; font-weight: 600; color: #fff; letter-spacing: -0.02em; }
.fav.lg { width: 20px; height: 20px; font-size: 11.5px; }
.fav.xl { width: 36px; height: 36px; border-radius: 9px; font-size: 15px; }
.tagpill { display: inline-flex; align-items: center; gap: 3px; height: 24px; padding: 0 9px; border-radius: 999px; background: var(--hov); color: var(--mut); font-size: 12.5px; font-weight: 500; transition: background .12s, color .12s; }
.tagpill b { font-weight: 500; color: var(--fnt); }
button.tagpill:active { transform: scale(.96); }
@media (hover: hover) and (pointer: fine) { button.tagpill:hover { background: var(--sel); color: var(--ink); } }
.capturing { color: var(--accent); font-size: 12px; display: inline-flex; align-items: center; gap: 4px; font-weight: 500; }
.capturing::before { content: "◌"; animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; } }
.daylabel { font-size: 12px; font-weight: 500; color: var(--fnt); padding: 14px 12px 6px; }
.skel { height: 12px; border-radius: 6px; background: var(--hov); margin: 10px 0; animation: pulse 1.6s ease-in-out infinite; }

/* ───────────── Shell ───────────── */
.app { position: relative; display: flex; height: 100%; }
.main { flex: 1; display: flex; min-width: 0; margin: 8px 8px 8px 0; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; box-shadow: var(--elev-1); }
.app.nosb .main { margin-left: 8px; }

/* Sidebar */
.sidebar { width: 244px; flex: none; display: flex; flex-direction: column; padding: 12px 10px; padding-top: calc(12px + var(--sat)); gap: 2px; background: var(--bg); overflow: auto; overscroll-behavior: contain; }
.sidebar .brandrow { display: flex; align-items: center; justify-content: space-between; padding: 4px 6px 14px 6px; }
.nav { display: flex; align-items: center; gap: 10px; min-height: 32px; padding: 0 10px; border-radius: var(--r); color: var(--mut); font-weight: 500; width: 100%; text-align: left; transition: background .12s, color .12s; }
.nav:active { background: var(--sel); }
@media (hover: hover) and (pointer: fine) { .nav:hover { background: var(--hov); color: var(--ink); } }
.nav.on { background: var(--panel); color: var(--ink); box-shadow: var(--elev-1), 0 0 0 1px var(--line); }
[data-theme="dark"] .nav.on { background: var(--sel); box-shadow: none; }
.nav .hash { width: 16px; text-align: center; color: var(--fnt); font-weight: 400; }
.nav .lbl { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sect { display: flex; align-items: center; justify-content: space-between; font-size: 12px; font-weight: 500; color: var(--fnt); padding: 16px 4px 6px 10px; }
.sidebar .grow { flex: 1; min-height: 12px; }
.newtag { display: flex; align-items: center; gap: 10px; height: 32px; padding: 0 10px; border-radius: var(--r); background: var(--panel); box-shadow: 0 0 0 1px var(--line-2); }
.newtag input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; font-weight: 500; }

/* Drawer sidebar (mid + narrow) */
.sb-scrim { position: absolute; inset: 0; background: var(--scrim); z-index: 30; animation: fade .2s var(--ease); }
.sidebar.drawer { position: absolute; z-index: 31; top: 0; bottom: 0; left: 0; width: min(280px, 84%); box-shadow: var(--elev-3); padding-bottom: calc(12px + var(--sab)); }
.sidebar.drawer.enter { animation: drawerin .3s var(--ease-drawer); }
@keyframes drawerin { from { transform: translateX(-100%); } }

/* List pane */
.listpane { width: 400px; flex: none; border-right: 1px solid var(--line); display: flex; flex-direction: column; min-width: 0; }
[data-mode="mid"] .listpane { width: 340px; }
.panehead { height: 48px; flex: none; display: flex; align-items: center; gap: 6px; padding: 0 10px 0 14px; border-bottom: 1px solid var(--line); }
.panehead h1 { font-size: 14px; font-weight: 600; margin: 0; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.panehead .count { margin-left: 2px; }
.panehead .sp { flex: 1; }
.scroll { overflow: auto; flex: 1; min-height: 0; overscroll-behavior: contain; }
.rows { padding: 0 8px 24px; }
.rowA { position: relative; display: flex; flex-direction: column; gap: 2px; padding: 9px 12px; border-radius: var(--r); cursor: default; transition: background .12s; }
.rowA:active { background: var(--sel); }
@media (hover: hover) and (pointer: fine) { .rowA:hover { background: var(--hov); } .rowA:hover .rowmore { opacity: 1; } }
.rowA.on, .rowA.on:hover { background: var(--sel); }
.rowA .l1 { display: flex; align-items: center; gap: 10px; min-width: 0; padding-right: 22px; }
.rowA .t { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rowA .l2 { padding-left: 28px; font-size: 12.5px; color: var(--fnt); display: flex; gap: 6px; align-items: center; min-width: 0; }
.rowA .l2 .d { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rowA .note { padding-left: 28px; font-size: 12.5px; color: var(--mut); font-style: italic; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rowA .purge { margin-left: auto; white-space: nowrap; }
.rowA.trashed .t { color: var(--mut); }
.rowA .agent { color: var(--accent-ink); }
.rowmore { position: absolute; top: 6px; right: 6px; opacity: 0; width: 26px; height: 26px; }
.rowmore.open { opacity: 1; background: var(--line); color: var(--ink); }
.rowA.fresh { animation: rowin .5s var(--ease); }
@keyframes rowin { from { background: var(--accent-soft); } }
.empty { padding: 48px 24px; text-align: center; color: var(--fnt); }
.empty b { display: block; color: var(--ink); font-weight: 600; margin-bottom: 4px; font-size: 14.5px; }
.hint-line { margin: 12px 12px 0; color: var(--fnt); font-size: 12.5px; }

/* Reader pane */
.readerpane { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.rtools { display: flex; align-items: center; gap: 2px; }
.readerpane .panehead { justify-content: space-between; padding: 0 10px; }
.reader { max-width: 680px; margin: 0 auto; padding: 40px 40px 80px; }
[data-mode="mid"] .reader { padding: 32px 28px 72px; }
.reader h2 { font-size: 30px; line-height: 1.15; font-weight: 600; letter-spacing: -0.025em; margin: 0 0 12px; text-wrap: balance; }
.reader .src { display: flex; align-items: center; gap: 8px; color: var(--mut); font-size: 13.5px; margin-bottom: 20px; flex-wrap: wrap; }
.reader .src .dot { color: var(--line-2); }
.agentmark { color: var(--accent-ink); font-weight: 500; }
.notecard { display: block; width: 100%; text-align: left; background: var(--hov); border-radius: var(--r-lg); padding: 14px 16px; margin: 0 0 22px; transition: background .12s; cursor: text; }
@media (hover: hover) and (pointer: fine) { .notecard:hover { background: var(--sel); } }
.notecard .h { font-size: 12px; font-weight: 500; color: var(--fnt); margin-bottom: 4px; display: flex; gap: 6px; }
.notecard .p { display: block; color: var(--ink); }
.addnote { display: inline-flex; align-items: center; gap: 6px; color: var(--fnt); font-size: 13px; font-weight: 500; height: 26px; padding: 0 8px; margin: 0 0 18px -8px; border-radius: var(--r-sm); }
@media (hover: hover) and (pointer: fine) { .addnote:hover { background: var(--hov); color: var(--ink); } }
.reader .tags { display: flex; gap: 6px; margin-bottom: 26px; flex-wrap: wrap; }
.reader .body p { font-size: 16px; line-height: 1.7; margin: 0 0 18px; }
.reader .body p.lead { color: var(--mut); }
.tweet { border: 1px solid var(--line); border-radius: var(--r-lg); padding: 18px 20px; font-size: 17px; line-height: 1.55; }
.tweet .who { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; font-size: 14px; }
.tweet .who span { color: var(--fnt); }
.hncard { border: 1px solid var(--line); border-radius: var(--r-lg); padding: 14px 16px; display: flex; gap: 24px; color: var(--mut); font-size: 13px; margin-bottom: 22px; }
.hncard b { color: var(--ink); font-weight: 600; font-size: 15px; display: block; }
.trashnote { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 12px 10px 14px; border-radius: var(--r-lg); background: var(--accent-soft); color: var(--accent-ink); font-size: 13px; font-weight: 500; margin-bottom: 22px; }
.trashnote .tn { flex: 1; min-width: 180px; }
.trashnote .acts { display: flex; gap: 6px; margin-left: auto; }
[data-mode="narrow"] .trashnote .acts { width: 100%; }
[data-mode="narrow"] .trashnote .acts .btn { flex: 1; height: 36px; font-size: 14px; }
.emptyreader { height: 100%; display: grid; place-items: center; color: var(--fnt); text-align: center; padding: 24px; }
.emptyreader p { margin: 14px 0 6px; color: var(--mut); font-weight: 500; }
.original { height: 100%; display: grid; place-items: center; padding: 24px; text-align: center; }
.ocard { max-width: 380px; display: flex; flex-direction: column; align-items: center; }
.ocard .oh { margin: 14px 0 6px; font-weight: 600; font-size: 15px; letter-spacing: -0.01em; text-wrap: balance; }
.ocard .od { margin: 0 0 18px; color: var(--mut); }
.ocard .ou { margin: 16px 0 0; color: var(--fnt); font-size: 12.5px; word-break: break-all; }
.ocard .acts { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.origwrap { height: 100%; display: flex; flex-direction: column; }
.origbar { height: 40px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 8px 0 16px; border-bottom: 1px solid var(--line); background: var(--bg); }
.origbar .u { flex: 1; min-width: 0; color: var(--mut); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.origframe { flex: 1; width: 100%; border: 0; background: #fff; }
.rbar { display: none; }

/* ───────────── Narrow (phone) ───────────── */
[data-mode="narrow"] .main, [data-mode="narrow"] .app.nosb .main { margin: 0; border: 0; border-radius: 0; box-shadow: none; }
[data-mode="narrow"] .listpane { width: 100%; border-right: 0; }
[data-mode="narrow"] .app[data-pane="reader"] .listpane, [data-mode="narrow"] .app[data-pane="list"] .readerpane { display: none; }
[data-mode="narrow"] .readerpane.enter { animation: pushin .32s var(--ease-drawer); }
@keyframes pushin { from { transform: translateX(28%); opacity: .4; } }
[data-mode="narrow"] .panehead { height: calc(52px + var(--sat)); padding-top: var(--sat); padding-left: 6px; padding-right: 6px; }
[data-mode="narrow"] .panehead h1 { font-size: 16px; }
[data-mode="narrow"] .iconbtn { width: 40px; height: 40px; border-radius: var(--r); }
[data-mode="narrow"] .iconbtn .ic { width: 18px; height: 18px; }
[data-mode="narrow"] .rows { padding: 0 6px calc(24px + var(--sab)); }
[data-mode="narrow"] .rowA { padding: 11px 12px; min-height: 56px; justify-content: center; }
[data-mode="narrow"] .rowA .t { font-size: 15px; }
[data-mode="narrow"] .rowA .l1 { padding-right: 0; }
[data-mode="narrow"] .rowmore { display: none; }
[data-mode="narrow"] .rowA.on { background: none; }
[data-mode="narrow"] .rowA.on:active { background: var(--sel); }
[data-mode="narrow"] .daylabel { padding-top: 18px; }
[data-mode="narrow"] .reader { padding: 22px 20px calc(96px + var(--sab)); }
[data-mode="narrow"] .reader h2 { font-size: 25px; }
[data-mode="narrow"] .reader .body p { font-size: 17px; }
[data-mode="narrow"] .tweet { padding: 16px; font-size: 16.5px; }
[data-mode="narrow"] .back { display: inline-flex; align-items: center; gap: 2px; height: 40px; padding: 0 10px 0 4px; border-radius: var(--r); color: var(--ink); font-weight: 500; font-size: 15px; }
[data-mode="narrow"] .back:active { background: var(--hov); }
[data-mode="narrow"] .rbar { display: flex; position: absolute; left: 0; right: 0; bottom: 0; z-index: 5; justify-content: space-around; align-items: center; padding: 6px 8px calc(6px + var(--sab)); background: color-mix(in srgb, var(--panel) 88%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--line); }
[data-mode="narrow"] .readerpane { position: relative; }
[data-mode="narrow"] .sb-scrim, [data-mode="narrow"] .sidebar.drawer { position: absolute; }
[data-mode="narrow"] .nav { min-height: 44px; font-size: 15px; }
[data-mode="narrow"] .newtag { height: 44px; }
[data-mode="narrow"] input, [data-mode="narrow"] textarea { font-size: 16px; }
[data-mode="narrow"] .trashnote { margin-bottom: 18px; }

/* ───────────── Layers: palette, modals, menu, toasts ───────────── */
.layer { position: absolute; inset: 0; z-index: 40; background: var(--scrim); display: flex; justify-content: center; align-items: flex-start; padding: 12vh 16px 16px; }
.layer.enter { animation: fade .15s var(--ease); }
.layer.enter > * { animation: pop .18s var(--ease); }
@keyframes fade { from { opacity: 0; } }
@keyframes pop { from { transform: scale(.97); opacity: 0; } }
.palette { width: min(620px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-xl); box-shadow: var(--elev-3); overflow: hidden; display: flex; flex-direction: column; max-height: 100%; }
.palette .in { display: flex; align-items: center; gap: 10px; height: 54px; flex: none; padding: 0 12px 0 16px; border-bottom: 1px solid var(--line); }
.palette input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; font-size: 16px; }
.palette .list { overflow: auto; overscroll-behavior: contain; padding-bottom: 6px; }
.palette .grp { font-size: 12px; font-weight: 500; color: var(--fnt); padding: 10px 16px 4px; }
.palette .it { display: flex; align-items: center; gap: 10px; min-height: 40px; margin: 0 6px; padding: 0 10px; border-radius: var(--r); width: calc(100% - 12px); text-align: left; color: var(--ink); }
.palette .it .ic { color: var(--mut); }

     [dark ? I.sun : I.moon, `Switch to ${dark ? 'light' : 'dark'} mode`, () => { S.palette = null; setTheme(dark ? 'light' : 'dark'); render(); }],

function render() {

  const saved = {};

  const active = document.activeElement;

  $('#frame').dataset.mode = S.mode;
  $('#app').innerHTML = app();
  $('#layers').innerHTML = paletteLayer() + editLayer() + settingsLayer() + confirmLayer() + menuLayer();
  $('#proto').innerHTML = protoBar();
  $('#frame').classList.toggle('protomin', S.protoMin);
  document.querySelectorAll('[data-scroll]').forEach((el) => { if (saved[el.dataset.scroll] != null) el.scrollTop = saved[el.dataset.scroll]; });
  // focus management
  const want = S.enter.has('palette') ? 'pq' : S.enter.has('newtag') ? 'newtag' : S.enter.has('edit') ? (S.edit.focus === 'note' ? 'ed-note' : S.edit.focus === 'tags' ? 'ed-tag' : 'ed-title') : focusId;
  const el = want && document.getElementById(want);
  if (el) { el.focus({ preventScroll: true }); if (caret && want === focusId) try { el.setSelectionRange(...caret); } catch (e) {} else if (el.select && want === 'ed-title') el.select(); }
  if (S.menu) { const m = $('#menu'); const fr = $('#frame').getBoundingClientRect(); const r = m.getBoundingClientRect();
    if (r.right > fr.right - 8) m.style.left = `${Math.max(8, S.menu.x - r.width)}px`;
    if (r.bottom > fr.bottom - 8) m.style.top = `${Math.max(8, S.menu.y - r.height - (S.menu.h || 0))}px`; }
  S.enter.clear(); S.fresh = null;
}

function closeLayers() {

function saveEdit() {

  if (pending && !S.edit.tags.includes(pending)) S.edit.tags.push(pending);

  l.note = $('#ed-note').value.trim() || null;

document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-act],[data-tag],[data-sel],[data-tab],[data-pi],[data-op],[data-stab],[data-pref],[data-toggle],[data-menu],[data-device],[data-rmtag],[data-addtag],[data-revoke]');
  if (!t || t.disabled) return;
  // clicks inside a dialog never reach the scrim's close action
  if (t.classList.contains('layer') && e.target.closest('[data-stop]')) return;
  const a = t.dataset.act;
  const l = cur();
  if (t.dataset.menu) { e.stopPropagation(); if (S.menu?.id === +t.dataset.menu) { S.menu = null; return render(); } return openMenu(+t.dataset.menu, t, 'row'); }
  if (t.dataset.rmtag) { S.edit.tags = S.edit.tags.filter((x) => x !== t.dataset.rmtag); const ti = $('#ed-title').value, no = $('#ed-note').value; render(); $('#ed-title').value = ti; $('#ed-note').value = no; return; }
  if (t.dataset.addtag) return addEditTag(t.dataset.addtag);
  if (t.dataset.device) { S.device = t.dataset.device; $('#stage').dataset.device = S.device; setParam('device', S.device); return requestAnimationFrame(measure); }
  if (t.dataset.pi) { const it = PITEMS[+t.dataset.pi]; return it && it.run(); }
  if (t.dataset.op) { const op = t.dataset.op; S.palette.q = (S.palette.q.trim() ? S.palette.q.trim() + ' ' : '') + op; S.palette.i = 0; render(); $('#pq').focus(); return; }
  if (t.dataset.stab) { S.settings.tab = t.dataset.stab; return render(); }
  if (t.dataset.pref) { const k = t.dataset.pref; const v = k === 'purge' ? +t.dataset.val : t.dataset.val; if (k === 'theme') setTheme(v); else S.prefs[k] = v; return render(); }
  if (t.dataset.toggle) { const k = t.dataset.toggle; if (k.startsWith('plugin:')) { const p = k.slice(7); S.plugins[p] = !S.plugins[p]; toast(`${t.getAttribute('aria-label')} ${S.plugins[p] ? 'on' : 'off'}`); } else S.prefs[k] = !S.prefs[k]; return render(); }
  if (t.dataset.revoke) { const tok = S.tokens.find((x) => x.id === +t.dataset.revoke); S.tokens = S.tokens.filter((x) => x !== tok); render(); return toast(`Revoked “${tok.name}”`, () => { S.tokens.push(tok); render(); }); }
  if (t.dataset.tag) { go('library', S.tag === t.dataset.tag && t.classList.contains('nav') ? null : t.dataset.tag); return render(); }
  if (t.dataset.sel) { if (e.target.closest('.rowmore')) return; select(+t.dataset.sel); return render(); }
  if (t.dataset.tab) { S.tab = t.dataset.tab; return render(); }
  switch (a) {
    case 'palette': S.palette = { q: '', i: 0 }; S.drawer = false; S.enter.add('palette'); break;
    case 'add': S.palette = { q: '', i: 0, add: true }; S.enter.add('palette'); break;
    case 'closepal': S.palette = null; break;
    case 'lib': go('library'); break;
    case 'trash': go('trash'); break;
    case 'theme': setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'); break;
    case 'settings': S.settings = { tab: 'preferences' }; S.drawer = false; S.enter.add('settings'); break;
    case 'closeset': S.settings = null; break;
    case 'togglesb': S.sidebar = !S.sidebar; break;
    case 'opendrawer': if (S.mode === 'wide') S.sidebar = true; else { S.drawer = true; S.enter.add('drawer'); } break;
    case 'closedrawer': S.drawer = false; break;
    case 'newtag': S.newTag = true; S.enter.add('newtag'); break;
    case 'emptytrash': return askEmptyTrash();
    case 'closereader': S.sel = null; break;
    case 'back': S.pane = 'list'; break;
    case 'prev': return step(-1);
    case 'next': return step(1);
    case 'copy': return l && copy(l.url);
    case 'edit': case 'edittags': return l && openEdit(l.id, a === 'edittags' ? 'tags' : 'title');

    case 'readermenu': return l && openMenu(l.id, t, 'reader');
    case 'closemenu': S.menu = null; break;
    case 'm-close': S.menu = null; break;
    case 'm-copy': { const id = S.menu.id; S.menu = null; render(); return copy(byId(id).url); }
    case 'm-edit': return openEdit(S.menu.id, 'title');
    case 'm-note': return openEdit(S.menu.id, 'note');
    case 'm-trash': return trashLink(S.menu.id);
    case 'm-restore': return restoreLink(S.menu.id);
    case 'm-delete': return askDelete(S.menu.id);
    case 'closeedit': S.edit = null; break;
    case 'saveedit': return saveEdit();
    case 'closeconfirm': S.confirm = null; break;
    case 'confirmok': { const c = S.confirm; S.confirm = null; c.run(); break; }
    case 'export': return exportJson();
    case 'import': return $('#importfile').click();
    case 'copymcp': return copy('https://silo.local/mcp', 'MCP URL copied');
    case 'newtoken': { const tok = { id: Date.now(), name: `New token ${S.tokens.length + 1}`, used: 'Never used' }; S.tokens.push(tok); render(); return copy('silo_tok_prototype_only', 'Token created and copied'); }

});

document.addEventListener('keydown', (e) => {
  const k = e.key;

  if ((e.metaKey || e.ctrlKey) && k.toLowerCase() === 'k') { e.preventDefault(); S.palette = S.palette ? null : { q: '', i: 0 }; if (S.palette) S.enter.add('palette'); return render(); }
  if (k === 'Escape') { e.preventDefault(); return closeLayers(); }
  if (S.edit && (e.metaKey || e.ctrlKey) && k === 'Enter') { e.preventDefault(); return saveEdit(); }
  if (e.target.id === 'pq') {
    if (k === 'ArrowDown' || k === 'ArrowUp') { e.preventDefault(); S.palette.i = Math.max(0, Math.min(PITEMS.length - 1, S.palette.i + (k === 'ArrowDown' ? 1 : -1))); render(); document.querySelector('.palette .it.on')?.scrollIntoView({ block: 'nearest' }); }
    if (k === 'Enter') { e.preventDefault(); PITEMS[S.palette.i]?.run(); }

  }
  if (e.target.id === 'newtag') {

  else if (k === '[') { if (S.mode === 'wide') S.sidebar = !S.sidebar; else { S.drawer = !S.drawer; S.enter.add('drawer'); } render(); }

  else if ((k === 'Backspace' || k === 'Delete') && l) { e.preventDefault(); l.trashed ? askDelete(l.id) : trashLink(l.id); }

  }, 350);
});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (S.prefs.theme === 'system') { setTheme('system'); render(); } });

// width mode follows the frame
function measure() {
  const w = Math.round($('#frame').getBoundingClientRect().width);
  const mode = w >= 1100 ? 'wide' : w >= 720 ? 'mid' : 'narrow';
  const changed = mode !== S.mode || w !== S.frameW;
  if (mode !== S.mode) { S.drawer = false; if (mode !== 'narrow') S.pane = 'list'; else if (S.sel && S.pane !== 'reader') S.pane = 'list'; }
  S.mode = mode; S.frameW = w;
  if (changed) render();
}
new ResizeObserver(measure).observe($('#frame'));

// boot
const p = new URLSearchParams(location.search);
if (['fit', 'tablet', 'phone'].includes(p.get('device'))) { S.device = p.get('device'); $('#stage').dataset.device = S.device; }
setTheme(['light', 'dark', 'system'].includes(p.get('theme')) ? p.get('theme') : 'light');
measure(); render();
</script>
</body>
</html>
