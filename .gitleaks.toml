# gitleaks configuration for silo.
#
# We extend gitleaks' built-in default ruleset (so every stock secret rule
# still applies to all source code) and add a NARROW allowlist for known test
# fixtures: fake `silo_…`/`oat_…` tokens and dummy passwords hard-coded in
# *.test.* files and the QA harness scripts to exercise auth flows.
#
# These are not real credentials — a real token is `silo_`/`oat_` + 32 random
# bytes (high-entropy; see packages/core/src/auth/tokens.ts + auth/oauth.ts),
# whereas the fixtures are short, obviously-patterned strings (e.g.
# `silo_freshraw0987654321zzzz`, `oat_deadbeef`, `qa-env-token-not-for-prod`).
#
# The allowlist is scoped to test + QA-script paths, so a real secret
# accidentally committed to any SOURCE file is still caught by the full default
# ruleset.

[extend]
useDefault = true

[allowlist]
description = "Fake token fixtures in test files + QA harness scripts (not real credentials)"
paths = [
  '''.*\.test\.(ts|tsx)$''',
  '''.*/test-support/.*''',
  '''^scripts/qa/.*''',
]
