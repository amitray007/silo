name: Release

# Auto-release the distributables (Chrome extension, Raycast extension, CLI) on
# merge to main — but ONLY the one(s) whose OWN code changed. The three are
# self-contained (their only internal dep is @silo/tsconfig, a build-time
# config), so a change to web/api/mcp/core never triggers a release here. See
# docs/releasing.md + docs/superpowers/specs/2026-07-11-releases-and-versioning.md.
#
# Flow: detect changed paths in the pushed range -> @silo/release computes which
# distributables to bump (patch by default; #minor/#major in a commit overrides)
# and writes the new versions -> commit the bump [skip ci] -> per distributable,
# build its artifact, tag it, and cut a GitHub Release with the artifact
# attached. web/api/mcp/core-only pushes plan nothing and the build jobs no-op.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      distributables:
        description: >-
          Comma-separated distributables to force-release (chrome, raycast,
          cli). Use to re-run a release that a push missed. Leave blank on a
          normal push-triggered run.
        required: false
        default: ''
      bump:
        description: 'Bump size for a manual run (patch, minor, major)'
        required: false
        default: 'patch'

permissions:
  contents: write # create tags, commits, and GitHub Releases

concurrency:
  # Serialize releases on main so two pushes can't race the bump commit.
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: plan · bump · commit
    runs-on: ubuntu-latest
    outputs:
      releases: ${{ steps.plan.outputs.releases }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0 # need history to diff the pushed range + push the bump commit
          # RELEASE_TOKEN (a fine-grained PAT scoped to this repo with Contents:
          # write) is required to push the bump commit + tags: the `protect-main`
          # ruleset blocks the default GITHUB_TOKEN (github-actions[bot] isn't a
          # bypass actor), whereas a PAT owned by a repo admin inherits the
          # admin bypass. Falls back to GITHUB_TOKEN so non-pushing runs still work.
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The paths changed by this push, and the pushed commits' messages
      # (NUL-separated so a multi-line message can't split wrong) — handed to the
      # release runner via env, matching run.ts's contract.
      - name: compute changed paths + commit messages
        id: ctx
        env:
          FORCE_DISTS: ${{ github.event.inputs.distributables }}
          FORCE_BUMP: ${{ github.event.inputs.bump }}
        run: |
          # Manual dispatch with an explicit distributables list: synthesize a
          # representative changed-path per requested distributable so the
          # planner selects exactly those (used to recover a release a push
          # missed). The bump size comes from the `bump` input via a #flag.
          if [ -n "$FORCE_DISTS" ]; then
            PATHS=""
            IFS=',' read -ra WANT <<< "$FORCE_DISTS"
            for d in "${WANT[@]}"; do
              d="$(echo "$d" | tr -d '[:space:]')"
              case "$d" in
                chrome)  PATHS+="extensions/chrome/package.json"$'\n' ;;
                raycast) PATHS+="extensions/raycast/package.json"$'\n' ;;
                cli)     PATHS+="packages/cli/package.json"$'\n' ;;
                *) echo "::error::unknown distributable '$d'"; exit 1 ;;
              esac
            done
            case "$FORCE_BUMP" in
              minor) MSGS='manual release #minor' ;;
              major) MSGS='manual release #major' ;;
              *)     MSGS='manual release' ;;
            esac
            {
              echo 'paths<<__EOF__'; printf '%s' "$PATHS"; echo '__EOF__'
            } >> "$GITHUB_OUTPUT"
            echo "messages=$MSGS" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BEFORE='${{ github.event.before }}'
          AFTER='${{ github.sha }}'
          # On the branch's very first push, `before` is all-zeros — fall back to
          # diffing against the parent so we don't try to release the whole repo.
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE="$(git rev-parse "${AFTER}^" 2>/dev/null || echo "$AFTER")"
          fi
          {
            echo 'paths<<__EOF__'
            git diff --name-only "$BEFORE" "$AFTER"
            echo '__EOF__'
          } >> "$GITHUB_OUTPUT"
          # NUL-join the commit messages into one env-safe value.
          MSGS="$(git log --format=%B "$BEFORE".."$AFTER" | tr '\n' ' ')"
          echo "messages=$MSGS" >> "$GITHUB_OUTPUT"

      - name: plan releases (bump versions in place)
        id: plan
        env:
          RELEASE_CHANGED_PATHS: ${{ steps.ctx.outputs.paths }}
          # The runner splits on NUL; a space-joined single string still works
          # for the #minor/#major substring scan (the only thing messages drive).
          RELEASE_COMMIT_MESSAGES: ${{ steps.ctx.outputs.messages }}
          RELEASE_REPO_ROOT: ${{ github.workspace }}
        run: pnpm --filter @silo/release run release

      # The bump writes version files with JSON.stringify (2-space indent), which
      # expands short arrays onto multiple lines — but Biome inlines them. Format
      # the bumped files so the commit matches the repo's own format gate;
      # otherwise every chrome bump (its manifest.json has permission arrays)
      # would land on main already failing `pnpm quality`.
      - name: format bumped files
        if: steps.plan.outputs.releases != '[]'
        run: pnpm exec biome format --write extensions packages

      - name: commit the version bump
        if: steps.plan.outputs.releases != '[]'
        # LEFTHOOK=0 + --no-verify: skip the local git hooks (pre-commit Biome,
        # pre-push type/test/quality gate). Those are for developer machines;
        # here they'd run the DB-backed test suite with no Postgres in this
        # runner and fail the bump. CI's own test job is the gate for main.
        env:
          LEFTHOOK: '0'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          # [skip ci] so the bump commit doesn't re-trigger this workflow.
          git commit --no-verify -m "chore(release): version bump [skip ci]"
          git push --no-verify

  release:
    name: build · tag · release
    needs: plan
    if: needs.plan.outputs.releases != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        entry: ${{ fromJson(needs.plan.outputs.releases) }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          # Check out the bump commit the plan job just pushed.
          ref: main
          # Use RELEASE_TOKEN so tag creation isn't blocked by the ruleset.
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # --- Chrome: build the Web Store zip -------------------------------------
      - name: build chrome zip
        if: matrix.entry.distributable == 'chrome'
        run: |
          pnpm --filter @silo/extension-chrome run build
          cp extensions/chrome/dist-zip/silo-capture.zip "silo-capture-${{ matrix.entry.to }}.zip"

      # --- CLI: build + pack a self-contained tarball --------------------------
      - name: build cli tarball
        if: matrix.entry.distributable == 'cli'
        run: |
          pnpm --filter @silo/cli run build
          # The CLI has zero runtime deps — tar up dist/ + package.json + LICENSE
          # so `npm i -g <tarball>` / brew can install a self-contained bin.
          tar -czf "silo-cli-${{ matrix.entry.to }}.tgz" \
            -C packages/cli dist package.json \
            -C "$GITHUB_WORKSPACE" LICENSE

      # --- Raycast: prove it's store-ready (no artifact to attach) -------------
      - name: verify raycast is store-ready
        if: matrix.entry.distributable == 'raycast'
        run: |
          pnpm --filter silo-raycast exec ray lint --relaxed
          pnpm --filter silo-raycast run build

      # --- OPTIONAL: publish the Chrome zip to the Web Store -------------------
      # SCAFFOLDED + GATED: runs only when the CWS_* secrets exist, so it's inert
      # until you set them up (see docs/releasing.md → "Chrome Web Store"). The
      # zip built above is the exact upload. Requires a registered Web Store
      # developer account + a published (at least once, manually) listing.
      - name: publish to Chrome Web Store (if configured)
        if: matrix.entry.distributable == 'chrome' && vars.CWS_ENABLED == 'true'
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
        run: |
          npx --yes chrome-webstore-upload-cli@3 upload \
            --source "silo-capture-${{ matrix.entry.to }}.zip" \
            --extension-id "$CWS_EXTENSION_ID" \
            --client-id "$CWS_CLIENT_ID" \
            --client-secret "$CWS_CLIENT_SECRET" \
            --refresh-token "$CWS_REFRESH_TOKEN"
          # NOT auto-published to users — leave it in the Web Store dashboard for
          # you to review + submit, since Google reviews each version. Add
          # `--auto-publish` here only once you're comfortable.

      # --- Create the tag + GitHub Release -------------------------------------
      - name: create GitHub Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2
        with:
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          tag_name: ${{ matrix.entry.tag }}
          name: ${{ matrix.entry.distributable }} v${{ matrix.entry.to }}
          body: |
            Automated release of **${{ matrix.entry.distributable }}** ${{ matrix.entry.from }} → ${{ matrix.entry.to }}.

            ${{ matrix.entry.distributable == 'chrome' && 'Download `silo-capture-*.zip` below and upload it to the Chrome Web Store, or load it unpacked.' || '' }}
            ${{ matrix.entry.distributable == 'cli' && 'Install via Homebrew (`brew install amitray007/tap/silo`) or download the tarball below.' || '' }}
            ${{ matrix.entry.distributable == 'raycast' && 'Published to the Raycast Store from source — run `pnpm --filter silo-raycast exec ray publish` to open the store PR.' || '' }}
          files: |
            silo-capture-${{ matrix.entry.to }}.zip
            silo-cli-${{ matrix.entry.to }}.tgz
          fail_on_unmatched_files: false

      # --- CLI only: render the Homebrew formula + push it to the tap ----------
      # Mirrors the amitray007/homebrew-tap pattern: compute the tarball sha256,
      # render scripts/silo-formula.template.rb, and push Formula/silo.rb into
      # amitray007/homebrew-tap so `brew install amitray007/tap/silo` picks up
      # the new version. silo is PUBLIC, so the formula's url points straight at
      # this repo's Release asset (no re-hosting on the tap needed).
      # GATED on HOMEBREW_TAP_TOKEN existing (skips cleanly until you add it).
      - name: compute tarball sha256
        id: sha
        if: matrix.entry.distributable == 'cli'
        run: echo "sha=$(shasum -a 256 "silo-cli-${{ matrix.entry.to }}.tgz" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: checkout homebrew-tap
        if: matrix.entry.distributable == 'cli' && vars.HOMEBREW_TAP_ENABLED == 'true'
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          repository: amitray007/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: render + push the formula to the tap
        if: matrix.entry.distributable == 'cli' && vars.HOMEBREW_TAP_ENABLED == 'true'
        run: |
          VERSION='${{ matrix.entry.to }}'
          URL="https://github.com/${{ github.repository }}/releases/download/${{ matrix.entry.tag }}/silo-cli-${VERSION}.tgz"
          mkdir -p homebrew-tap/Formula
          sed -e "s|{{VERSION}}|${VERSION}|g" \
              -e "s|{{URL}}|${URL}|g" \
              -e "s|{{SHA256}}|${{ steps.sha.outputs.sha }}|g" \
              scripts/silo-formula.template.rb > homebrew-tap/Formula/silo.rb
          cd homebrew-tap
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add Formula/silo.rb
          # --no-verify: no local hooks should gate a CI push into the tap.
          git commit --no-verify -m "silo: bump to ${VERSION}"
          git push --no-verify origin HEAD
