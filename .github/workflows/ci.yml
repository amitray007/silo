name: CI

# Mirrors the local lefthook gate so --no-verify cannot bypass it.
# Make this a required status check on main in branch-protection settings.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: typecheck · lint · test · quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run check-types
      - run: pnpm turbo run test
      - run: pnpm quality

  pr-title:
    name: PR title (conventional commits)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Check PR title is a conventional commit
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "PR title: $TITLE"
          if ! printf '%s' "$TITLE" | grep -qE '^(feat|fix|docs|refactor|perf|test|chore|build|ci)(\(.+\))?!?: .+'; then
            echo "::error::PR title must be a conventional commit, e.g. 'feat: add search'"
            exit 1
          fi
