name: CI

# Mirrors the local lefthook gate so --no-verify cannot bypass it.
#
# The gate is split into parallel jobs (typecheck | test-shards | build+quality)
# so wall-clock is ~the slowest job instead of the sum of all steps. The `gate`
# job at the bottom aggregates them into ONE stable required-status-check name —
# make `gate` the required check in branch protection so the matrix shard count
# can change without editing protection settings.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run check-types

  test:
    name: test (${{ matrix.group.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Split the test work across parallel runners by PACKAGE (turbo
        # --filter), NOT by vitest --shard: --shard splits a package's test
        # FILES and hard-errors on any package with fewer files than the shard
        # count (e.g. @silo/queue has 1 test file), so per-package sharding
        # across the monorepo is a non-starter. Package groups parallelize
        # cleanly instead. Each runner gets its OWN Postgres service, so the DB
        # suites — which mutate a shared @silo/db pool singleton and therefore
        # keep `--no-file-parallelism` WITHIN a package — never contend across
        # groups.
        #
        # Groups are balanced by measured per-package test cost (local, roughly
        # proportional to CI): the two heaviest suites are mcp-server + worker
        # (~17s each), then core (~15s), api/web (~11s), app (~10s), db (~8s),
        # queue (~4s), release/cli (~1s). Pairing a heavy DB package with a
        # lighter one keeps all three groups near-equal (~30s local each) so no
        # single group is the long pole. `others` uses NEGATION so any new
        # package lands there by default rather than being silently untested —
        # if it turns out heavy, move it into a named group and rebalance.
        group:
          - name: core + worker
            filter: "--filter=@silo/core --filter=@silo/worker"
          - name: api + mcp-server
            filter: "--filter=@silo/api --filter=@silo/mcp-server"
          - name: others
            filter: "--filter=!@silo/core --filter=!@silo/worker --filter=!@silo/api --filter=!@silo/mcp-server"
    # pgvector/pgvector:pg18 (not plain postgres:18) because migrations run
    # `CREATE EXTENSION vector` — this image ships pgvector so it just works.
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # The integration harness reads TEST_DATABASE_URL (admin URL, for
      # createdb/psql) and DATABASE_URL. CI_REQUIRE_DB makes an unreachable DB
      # fail the build instead of silently skipping the integration suites.
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      CI_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `--test-timeout=20000` (CI only) gives slow shared runners headroom over
      # vitest's 5s default — a normally-sub-second test (e.g. the mcp-http 401
      # check) was flaking on the overloaded single-job runner; it never needs
      # 20s locally. The package filter selects this group's slice of the suite.
      - run: pnpm turbo run test ${{ matrix.group.filter }} -- --test-timeout=20000

  build-quality:
    name: build · quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build
      # Bundle safety (belt-and-suspenders — the real guard is the enforced
      # import boundary: web may not import @silo/core/@silo/db, so pg can't
      # enter the browser graph). Fail if server code ever leaks into the SPA
      # bundle anyway.
      - name: web bundle has no server code
        run: |
          if grep -rlE "drizzle-orm|@silo/db|require\('pg'\)|node:(fs|net|tls|dns)" packages/web/dist/assets/ ; then
            echo "::error::server code leaked into the @silo/web browser bundle"
            exit 1
          fi
      - run: pnpm quality

  gate:
    # Single stable status check aggregating the parallel jobs above — make THIS
    # the required check in branch protection. Succeeds only if every needed job
    # succeeded; `if: always()` + the explicit result check means a skipped or
    # failed dependency fails the gate rather than being silently ignored.
    name: typecheck · lint · test · quality
    runs-on: ubuntu-latest
    needs: [typecheck, test, build-quality]
    if: always()
    steps:
      - name: All gate jobs passed
        run: |
          if [ "${{ needs.typecheck.result }}" != "success" ] \
            || [ "${{ needs.test.result }}" != "success" ] \
            || [ "${{ needs.build-quality.result }}" != "success" ]; then
            echo "::error::a gate job failed: typecheck=${{ needs.typecheck.result }} test=${{ needs.test.result }} build-quality=${{ needs.build-quality.result }}"
            exit 1
          fi
          echo "all gate jobs passed"

  pr-title:
    name: PR title (conventional commits)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Check PR title is a conventional commit
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "PR title: $TITLE"
          if ! printf '%s' "$TITLE" | grep -qE '^(feat|fix|docs|refactor|perf|test|chore|build|ci)(\(.+\))?!?: .+'; then
            echo "::error::PR title must be a conventional commit, e.g. 'feat: add search'"
            exit 1
          fi
