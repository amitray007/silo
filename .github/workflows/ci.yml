name: CI

# Mirrors the local lefthook gate so --no-verify cannot bypass it.
# Make this a required status check on main in branch-protection settings.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: typecheck · lint · test · quality
    runs-on: ubuntu-latest
    # pgvector/pgvector:pg18 (not plain postgres:18) because migrations run
    # `CREATE EXTENSION vector` — this image ships pgvector so it just works.
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # The integration harness reads TEST_DATABASE_URL (admin URL, for
      # createdb/psql) and DATABASE_URL. CI_REQUIRE_DB makes an unreachable DB
      # fail the build instead of silently skipping the integration suites.
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      CI_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run check-types
      - run: pnpm turbo run test
      - run: pnpm turbo run build
      # Bundle safety (belt-and-suspenders — the real guard is the enforced
      # import boundary: web may not import @silo/core/@silo/db, so pg can't
      # enter the browser graph). Fail if server code ever leaks into the SPA
      # bundle anyway.
      - name: web bundle has no server code
        run: |
          if grep -rlE "drizzle-orm|@silo/db|require\('pg'\)|node:(fs|net|tls|dns)" packages/web/dist/assets/ ; then
            echo "::error::server code leaked into the @silo/web browser bundle"
            exit 1
          fi
      - run: pnpm quality

  pr-title:
    name: PR title (conventional commits)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Check PR title is a conventional commit
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "PR title: $TITLE"
          if ! printf '%s' "$TITLE" | grep -qE '^(feat|fix|docs|refactor|perf|test|chore|build|ci)(\(.+\))?!?: .+'; then
            echo "::error::PR title must be a conventional commit, e.g. 'feat: add search'"
            exit 1
          fi
