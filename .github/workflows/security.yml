name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    name: pnpm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Fail on moderate+ advisories; adjust the level as the project matures.
      - run: pnpm audit --audit-level moderate

  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
      # Run the gitleaks CLI directly rather than the gitleaks-action wrapper.
      # We only ever want a plain filesystem scan of the working tree
      # (`detect --no-git`), but the action's `pull_request` code path insists
      # on calling the GitHub API (to fetch the PR commit range / post a
      # summary comment). That path needs a GITHUB_TOKEN and elevated
      # permissions (`pull-requests: write`) and still fails on this repo with
      # "Resource not accessible by integration" — none of which a tree scan
      # needs. Invoking the CLI keeps this job token-free, permission-free, and
      # identical on push and PR events. Pinned to the same version the action
      # used (8.24.x). `|| gitleaks detect ...` — non-zero exit means a leak
      # was found, which correctly fails the job.
      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION=8.24.3
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan for secrets
        run: gitleaks detect --source . --redact --no-git --verbose
