name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    name: pnpm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Fail on moderate+ advisories; adjust the level as the project matures.
      - run: pnpm audit --audit-level moderate

  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
      # Scan the full working tree rather than the push commit range — the
      # range form breaks on the initial push (parent of the first commit
      # doesn't exist). GITLEAKS_ENABLE_UPLOAD_ARTIFACT off avoids the SARIF
      # upload path that isn't needed for a private repo.
      - uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
        with:
          args: detect --source . --redact --no-git
