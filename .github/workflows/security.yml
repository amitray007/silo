name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      # `pnpm audit` was retired: it calls npm's legacy quick/bulk audit
      # endpoints (`/-/npm/v1/security/audits{,/quick}`), which npm shut off —
      # they now return HTTP 410 ("This endpoint is being retired"), so
      # `pnpm audit` errors out on every run regardless of the tree. We scan
      # the lockfile with osv-scanner instead: it reads `pnpm-lock.yaml`
      # natively and queries OSV.dev (an independent, live database), and
      # exits non-zero when a vulnerability is found — which fails this job.
      # Installed as a pinned CLI binary (mirroring the gitleaks job below)
      # rather than via the action wrapper, to keep the step transparent and
      # free of a shifting action-input schema.
      - name: Install osv-scanner
        run: |
          OSV_VERSION=2.3.8
          curl -sSfL "https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/osv-scanner_linux_amd64" \
            -o /usr/local/bin/osv-scanner
          chmod +x /usr/local/bin/osv-scanner
          osv-scanner --version
      - name: Scan dependencies
        run: osv-scanner scan --lockfile=pnpm-lock.yaml

  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
      # Run the gitleaks CLI directly rather than the gitleaks-action wrapper.
      # We only ever want a plain filesystem scan of the working tree
      # (`detect --no-git`), but the action's `pull_request` code path insists
      # on calling the GitHub API (to fetch the PR commit range / post a
      # summary comment). That path needs a GITHUB_TOKEN and elevated
      # permissions (`pull-requests: write`) and still fails on this repo with
      # "Resource not accessible by integration" — none of which a tree scan
      # needs. Invoking the CLI keeps this job token-free, permission-free, and
      # identical on push and PR events. Pinned to the same version the action
      # used (8.24.x). `|| gitleaks detect ...` — non-zero exit means a leak
      # was found, which correctly fails the job.
      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION=8.24.3
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan for secrets
        # --config points at .gitleaks.toml (extends the default ruleset + a
        # narrow allowlist for fake silo_ token fixtures in test files).
        run: gitleaks detect --source . --config .gitleaks.toml --redact --no-git --verbose
