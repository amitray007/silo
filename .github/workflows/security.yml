name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    name: pnpm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Fail on moderate+ advisories; adjust the level as the project matures.
      - run: pnpm audit --audit-level moderate

  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
      # Scan the full working tree rather than the push commit range — the
      # range form breaks on the initial push (parent of the first commit
      # doesn't exist). GITLEAKS_ENABLE_UPLOAD_ARTIFACT off avoids the SARIF
      # upload path that isn't needed for a private repo.
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          # Required for the action to scan `pull_request` events (it fetches
          # the PR's commit range via the API) — without it the action errors
          # out on every PR with "GITHUB_TOKEN is now required to scan pull
          # requests". The automatically-provisioned token is read-only here
          # (permissions: contents: read above), which is all gitleaks needs.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
